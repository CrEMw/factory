---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "hub-caller-hub-web"
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: "{{ .Values.nameOverride | default .Chart.Name }}"
    app.kubernetes.io/component: "hub"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
# The data array: withField in the AppHost cannot express it. Caller secret of hub-web from a secret store key
# (random_password, written by the platform Terraform). hub (volume callers,
# deploy/overlay/templates/hub/deployment.yaml) and hub-web (volume caller-secret) read it.
spec:
  refreshInterval: "5m"
  secretStoreRef:
    kind: "{{ .Values.secrets.store.kind }}"
    name: "{{ .Values.secrets.store.name }}"
  target:
    name: "hub-caller-hub-web"
    creationPolicy: "Owner"
  data:
    - secretKey: secret
      remoteRef:
        key: {{ index .Values.secrets.remoteKeys.callers "hub-web" | required "secrets.remoteKeys.callers.hub-web" }}
